  <text x="140.0" y="1156.0" font-family="Inter" font-size="15" font-weight="400" fill="#333333" text-anchor="start">&quot;Super entrecôte et les cannelés étaient</text>
  <text x="140.0" y="1178.5" font-family="Inter" font-size="15" font-weight="400" fill="#333333" text-anchor="start">parfaits !&quot;</text>
  <text x="140.0" y="1216.0" font-family="Inter" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Paul - 12/10/2026</text>
  <rect x="528.0" y="1086.0" width="384.0" height="150" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="548.0" y="1122.0" font-family="Inter" font-size="22" font-weight="400" fill="#666666" text-anchor="start">★★★★☆</text>
  <text x="548.0" y="1156.0" font-family="Inter" font-size="15" font-weight="400" fill="#333333" text-anchor="start">&quot;Menu de Noël très copieux et livré à</text>
  <text x="548.0" y="1178.5" font-family="Inter" font-size="15" font-weight="400" fill="#333333" text-anchor="start">l&#x27;heure.&quot;</text>
  <text x="548.0" y="1216.0" font-family="Inter" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Sophie - 12/10/2026</text>
