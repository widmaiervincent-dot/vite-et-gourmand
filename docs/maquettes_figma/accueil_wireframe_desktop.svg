  <text x="548.0" y="932.0" font-family="Inter" font-size="15" font-weight="400" fill="#333333" text-anchor="start">Producteurs locaux et marché des Capucins.</text>
  <rect x="936.0" y="804.0" width="384.0" height="170" rx="0" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <rect x="956.0" y="824.0" width="48" height="48" rx="24" fill="#D9D9D9" stroke="#999999" stroke-width="1"/>
