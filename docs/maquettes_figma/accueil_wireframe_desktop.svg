  <text x="720.0" y="400.6" font-family="Inter" font-size="16" font-weight="600" fill="#222222" text-anchor="middle">Découvrir nos menus</text>
  <text x="120" y="634" font-family="Inter" font-size="34" font-weight="700" fill="#222222" text-anchor="start">Qui sommes-nous ?</text>
  <text x="120" y="658.0" font-family="Inter" font-size="16" font-weight="400" fill="#333333" text-anchor="start">Vite &amp; Gourmand c&#x27;est l&#x27;histoire de Julie et José, deux passionnés de cuisine installés à Bordeaux depuis 25 ans. On prépare vos repas pour</text>
  <text x="120" y="682.0" font-family="Inter" font-size="16" font-weight="400" fill="#333333" text-anchor="start">tous vos évènements : Noël en famille, Pâques, anniversaire ou séminaire d&#x27;entreprise. Nos menus changent selon les saisons.</text>
  <text x="120" y="780.0" font-family="Inter" font-size="34" font-weight="700" fill="#222222" text-anchor="start">Une équipe de professionnels</text>
