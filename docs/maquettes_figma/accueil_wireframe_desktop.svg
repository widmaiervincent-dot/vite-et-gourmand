  <text x="956.0" y="954.5" font-family="Inter" font-size="15" font-weight="400" fill="#333333" text-anchor="start">autour.</text>
  <text x="120" y="1062.0" font-family="Inter" font-size="34" font-weight="700" fill="#222222" text-anchor="start">Ce que pensent nos clients</text>
